# Shannon 本番: main 更新時に VM で同期して ./start.sh
#
# Repository secrets: SHANNON_PROD_SSH_HOST, SHANNON_PROD_SSH_USER, SHANNON_PROD_SSH_PRIVATE_KEY
# 任意: SHANNON_PROD_REPO_PATH（未設定時は /home/azureuser/Shannon-prod）

name: Deploy production (Shannon)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shannon-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHANNON_PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEYFILE="$HOME/.ssh/shannon_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed '/[[:graph:]]/,$!d' > "$KEYFILE"
          sed -i '1s/^\xEF\xBB\xBF//' "$KEYFILE"
          chmod 600 "$KEYFILE"
          if ! test -s "$KEYFILE"; then
            echo "::error::SHANNON_PROD_SSH_PRIVATE_KEY が空です。"
            exit 1
          fi
          if ! grep -q 'BEGIN' "$KEYFILE" || ! grep -q 'PRIVATE KEY' "$KEYFILE" || ! grep -q 'END' "$KEYFILE"; then
            echo "::error::秘密鍵に BEGIN / PRIVATE KEY / END がありません。"
            exit 1
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHANNON_PROD_SSH_HOST }}
          username: ${{ secrets.SHANNON_PROD_SSH_USER }}
          key_path: /home/runner/.ssh/shannon_deploy
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${{ secrets.SHANNON_PROD_REPO_PATH }}"
            if [ -z "$DEPLOY_ROOT" ]; then
              DEPLOY_ROOT="/home/azureuser/Shannon-prod"
            fi
            cd "$DEPLOY_ROOT"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            command -v node
            command -v npm
            # @langchain/anthropic@1.x と backend の @langchain/core@0.3 系で peer が衝突するため
            npm ci --ignore-scripts --legacy-peer-deps
            npx patch-package

            # ネイティブモジュールのリビルド（npm ci --ignore-scripts でスキップされるため）
            echo "Building native modules..."
            cd node_modules/@discordjs/opus && npx @mapbox/node-pre-gyp install --fallback-to-build 2>&1 | tail -3 && cd "$DEPLOY_ROOT"
            # node-pre-gyp が glibc バージョンをテンプレートのまま残すバグの回避
            OPUS_PREBUILD="node_modules/@discordjs/opus/prebuild"
            if [ -d "$OPUS_PREBUILD" ]; then
              for d in "$OPUS_PREBUILD"/node-*-glibc-\{libc_version\}; do
                if [ -d "$d" ]; then
                  LIBC_VER=$(ldd --version 2>&1 | head -1 | grep -oP '[0-9]+\.[0-9]+$' || echo "2.31")
                  FIXED="${d/\{libc_version\}/$LIBC_VER}"
                  mv "$d" "$FIXED"
                  echo "Renamed opus prebuild dir → $(basename "$FIXED")"
                fi
              done
            fi
            cd node_modules/canvas && npm run install 2>&1 | tail -3 && cd "$DEPLOY_ROOT"
            echo "Native modules built."

            bash ./start.sh
            echo "Waiting for sessions to stabilize..."
            sleep 5
            tmux has-session -t shannon-backend-prod 2>/dev/null || { echo "::error::tmux セッション shannon-backend-prod がありません"; exit 1; }
            tmux has-session -t shannon-frontend-prod 2>/dev/null || { echo "::error::tmux セッション shannon-frontend-prod がありません"; exit 1; }
            echo "OK: shannon-backend-prod / shannon-frontend-prod が存在します"
