# Production promotion is manual. This workflow only checks the candidate; it never deploys.
#
# Repository secrets: SHANNON_PROD_SSH_HOST, SHANNON_PROD_SSH_USER, SHANNON_PROD_SSH_PRIVATE_KEY
# 任意: SHANNON_PROD_REPO_PATH（未設定時は /home/azureuser/Shannon-prod）

name: Production release preflight (Shannon)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Reviewed candidate commit (40 lowercase hex characters)'
        required: true
        type: string

concurrency:
  group: deploy-shannon-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHANNON_PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEYFILE="$HOME/.ssh/shannon_deploy"
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed '/[[:graph:]]/,$!d' > "$KEYFILE"
          sed -i '1s/^\xEF\xBB\xBF//' "$KEYFILE"
          chmod 600 "$KEYFILE"
          if ! test -s "$KEYFILE"; then
            echo "::error::SHANNON_PROD_SSH_PRIVATE_KEY が空です。"
            exit 1
          fi
          if ! grep -q 'BEGIN' "$KEYFILE" || ! grep -q 'PRIVATE KEY' "$KEYFILE" || ! grep -q 'END' "$KEYFILE"; then
            echo "::error::秘密鍵に BEGIN / PRIVATE KEY / END がありません。"
            exit 1
          fi

      - name: Check candidate without deploying
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          SHANNON_DEPLOY_ROOT: ${{ secrets.SHANNON_PROD_REPO_PATH }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHANNON_PROD_SSH_HOST }}
          username: ${{ secrets.SHANNON_PROD_SSH_USER }}
          key_path: /home/runner/.ssh/shannon_deploy
          envs: RELEASE_SHA,SHANNON_DEPLOY_ROOT
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${SHANNON_DEPLOY_ROOT:-}"
            if [ -z "$DEPLOY_ROOT" ]; then
              DEPLOY_ROOT="/home/azureuser/Shannon-prod"
            fi
            cd "$DEPLOY_ROOT"
            case "$RELEASE_SHA" in
              *[!0-9a-f]*|'') echo 'Invalid release SHA'; exit 1 ;;
            esac
            [ "${#RELEASE_SHA}" -eq 40 ] || exit 1
            [ -z "$(git status --porcelain)" ] || { echo 'Production is dirty; refusing to proceed'; exit 1; }
            git fetch origin "$RELEASE_SHA"
            git merge-base --is-ancestor 95426bb0cb71e3c8523aebe3ee477cc89fae7ebd "$RELEASE_SHA"
            echo 'Candidate includes preserved production changes. No deployment performed.'
            echo 'Complete readiness, user migration, backup/restore and rollback review before a separately approved cutover.'
