# main 更新時に本番 VM 上の Shannon-prod クローンを fast-forward し ./start.sh で tmux 再起動
# リポジトリ Secrets（Shannon2）: SHANNON_PROD_SSH_HOST, SHANNON_PROD_SSH_USER, SHANNON_PROD_SSH_PRIVATE_KEY
# 本番パスはデフォルト /home/azureuser/Shannon-prod（別パスなら SHANNON_PROD_REPO_PATH を設定）

name: Deploy Shannon production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shannon-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SHANNON_PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEYFILE="$HOME/.ssh/shannon_prod_deploy"
          # 先頭の空行を捨てる（貼り付けで先頭改行が入ると head -1 検証が誤爆する）
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed '/[[:graph:]]/,$!d' > "$KEYFILE"
          # UTF-8 BOM を除去
          sed -i '1s/^\xEF\xBB\xBF//' "$KEYFILE"
          chmod 600 "$KEYFILE"
          if ! test -s "$KEYFILE"; then
            echo "::error::SHANNON_PROD_SSH_PRIVATE_KEY が空です。Secret 名・環境（Shannon2 リポジトリ）を確認してください。"
            exit 1
          fi
          if ! grep -q 'BEGIN' "$KEYFILE" || ! grep -q 'PRIVATE KEY' "$KEYFILE" || ! grep -q 'END' "$KEYFILE"; then
            echo "::error::秘密鍵に BEGIN / PRIVATE KEY / END が見つかりません。全文を再登録するか、先頭・末尾の余計な空行を削除してください。"
            exit 1
          fi

      - name: SSH deploy (pull + start.sh)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SHANNON_PROD_SSH_HOST }}
          username: ${{ secrets.SHANNON_PROD_SSH_USER }}
          key_path: /home/runner/.ssh/shannon_prod_deploy
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${{ secrets.SHANNON_PROD_REPO_PATH }}"
            if [ -z "$DEPLOY_ROOT" ]; then
              DEPLOY_ROOT="/home/azureuser/Shannon-prod"
            fi
            cd "$DEPLOY_ROOT"
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
            fi
            command -v git
            command -v tmux
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            chmod +x ./start.sh 2>/dev/null || true
            ./start.sh
            echo "OK: Shannon prod updated and start.sh completed."
